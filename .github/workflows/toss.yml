name: 토스 미니앱 빌드 (조합장 키우기 단독)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['public/johapjang/**', 'toss/**', '.github/workflows/toss.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: toss } }
    env:
      AIT_API_KEY: ${{ secrets.AIT_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run build
      - run: ls -la; find dist -maxdepth 2 | head -30
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: toss-latest
          name: 토스 미니앱 번들 (조합장 키우기 단독, 최신)
          body: 앱인토스 콘솔 > 앱 출시 에 올릴 johapjang.ait 입니다 (재건축 조합장 키우기 단독 — 부동산 공화국 제외). 커밋 ${{ github.sha }}
          files: toss/johapjang.ait
          make_latest: true
      - name: 앱인토스 콘솔 업로드 (AIT_API_KEY 시크릿이 있을 때만)
        if: ${{ env.AIT_API_KEY != '' }}
        run: npx ait deploy --api-key "$AIT_API_KEY" -m "${{ github.sha }}"
