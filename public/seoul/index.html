/* ===== 움직이는 오늘의 이야기 ===== */
.scn.live text,.scn.live g{transform-box:fill-box;transform-origin:center}
.scn.live .tw{animation:tw 2.4s ease-in-out infinite}@keyframes tw{50%{opacity:.15}}
.scn.live .cloud{animation:cl 18s linear infinite}.scn.live .cloud.c2{animation-duration:26s;animation-direction:reverse}@keyframes cl{0%{transform:translateX(-30px)}50%{transform:translateX(30px)}100%{transform:translateX(-30px)}}
.bob{animation:bob 1.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-5px) rotate(-2deg)}}
.bob2{animation:bob 0.5s ease-in-out infinite}
.ride{animation:ride 4.2s linear infinite}@keyframes ride{0%{transform:translateX(-50px)}100%{transform:translateX(460px)}}
.coin{animation:coin 1.8s ease-out infinite;opacity:0}.coin.d2{animation-delay:.9s}@keyframes coin{0%{opacity:0;transform:translateY(20px) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translateY(-40px) scale(1.1)}}
.steam{animation:stm 2s ease-in-out infinite}@keyframes stm{0%{opacity:0;transform:translateY(6px)}50%{opacity:.8}100%{opacity:0;transform:translateY(-14px)}}
.spark{animation:spk 1.6s ease-in-out infinite}.spark.d2{animation-delay:.8s}@keyframes spk{50%{opacity:.2;transform:scale(.6) rotate(20deg)}}
.swap{opacity:0;animation:swp 3.6s infinite}.swap.s2{animation-delay:1.2s}.swap.s3{animation-delay:2.4s}@keyframes swp{0%,30%{opacity:1;transform:translateY(0)}33%,100%{opacity:0;transform:translateY(6px)}}
.drip{animation:drp 1.4s ease-in infinite}@keyframes drp{0%{opacity:0;transform:translateY(-6px)}30%{opacity:1}100%{opacity:0;transform:translateY(16px)}}
.zz{opacity:0;animation:zz 2.4s ease-out infinite}.zz.d2{animation-delay:.6s}.zz.d3{animation-delay:1.2s}@keyframes zz{0%{opacity:0;transform:translate(0,8px)}30%{opacity:1}100%{opacity:0;transform:translate(10px,-22px)}}
.spin{animation:spn 12s linear infinite}@keyframes spn{to{transform:rotate(360deg)}}
.run{animation:run .4s ease-in-out infinite}@keyframes run{50%{transform:translateY(-6px) rotate(4deg)}}
.stack{opacity:0;animation:stk 3s ease-out infinite}.stack.d2{animation-delay:.5s}.stack.d3{animation-delay:1s}@keyframes stk{0%{opacity:0;transform:translateY(-30px)}20%,80%{opacity:1;transform:translateY(0)}100%{opacity:0}}
.walk{animation:wlk 5s linear infinite}@keyframes wlk{0%{transform:translateX(-30px)}100%{transform:translateX(200px)}}
.tix{animation:bob 1s ease-in-out infinite}.smoke{animation:stm 2.6s ease-in-out infinite}.shake{animation:shk .5s ease-in-out infinite}@keyframes shk{25%{transform:translateX(-3px) rotate(-4deg)}75%{transform:translateX(3px) rotate(4deg)}}

const STK = {

function pickStory() {
  if (S.story && S.story.t === S.t && STORIES.find(x => x.id === S.story.id)) return STORIES.find(x => x.id === S.story.id);
  S.storyHist = S.storyHist || [];
  const recent = S.storyHist.slice(-6);
  let pool = STORIES.map(s => ({ s, w: (s.w() || 0) * (recent.includes(s.id) ? .08 : 1) })).filter(x => x.w > 0);
  let r = Math.random() * pool.reduce((a, x) => a + x.w, 0), pick = pool[0].s;
  for (const x of pool) { r -= x.w; if (r <= 0) { pick = x.s; break; } }
  S.story = { id: pick.id, t: S.t }; S.storyN = (S.storyN || 0) + 1; S.storyHist.push(pick.id); if (S.storyHist.length > 20) S.storyHist.shift();
  save();
  return pick;
}

function drawEvent() {
  const pool = EVENTS.map(e => [e, Math.max(0, e.w())]).filter(x => x[1] > 0 && x[0].id !== S.lastEv);
  let tot = pool.reduce((a, x) => a + x[1], 0), r = Math.random() * tot;
  for (const [e, w] of pool) { if ((r -= w) < 0) { S.lastEv = e.id; return e; } }
  return null;
}

function liveHome() { return S.props.find(p => p.kind === 'buy' && p.live); }
function happyTarget() {
  let t = S.res.type === 'wolse' ? 38 : S.res.type === 'jeonse' ? 50 : 62;
  const h = liveHome();
  if (h) { const tr = aptTr(h); t += (tr.nw || 0) * 8 + (tr.tr || 0) * 7 + (tr.hv || 0) * 12 + (tr.sc || 0) * (S.kids.length ? 8 : 2) + (h.remod ? 6 : 0) - (!h.vb && AP[h.aid].y && AP[h.aid].y < 1995 ? 5 : 0); }
  if (S.married >= 0) t += 6; t += Math.min(2, S.kids.length) * 4; if (S.parentsHelp) t += 3;
  const ds = annualDebtService(0, 0) / Math.max(.1, income());
  t -= ds > .5 ? 18 : ds > .4 ? 10 : ds > .3 ? 4 : 0;
  if (S.credit > 0) t -= 6;
  if (S.hp < 40) t -= 8;
  return clamp(t, 5, 98);
}
// 다음 반기로: 일하기 → 생활비 정산 → 경제(위기·집값·주식) → 보유 자산 → 인생

  if (S.tightCrisis > 0) S.tightCrisis--;
  msgs.unshift(`📊 서울 아파트 시장 ${pct(g)} · 기준금리 ${S.rate.toFixed(2)}% · 분위기 ${{ up: '상승장 🔥', flat: '보합 😐', down: '하락장 🧊' }[S.phase]}`);
  msgs.push(...R.stk.lines);
  if (S.layoffNext) { S.layoffNext = false; if (!S.biz) { const cut = r2(S.salary * .25); S.cash = r2(S.cash - cut); S.salary = r2(S.salary * .95); msgs.push(`🏢 금융위기 여파로 회사가 구조조정을 했습니다. 몇 달 쉬며 ${won(cut)}을 잃고 재취업했습니다.`); } }
  msgs.push(...progressProps());
  msgs.push(...crisis());
  if (S.t % 2 === 1) { if (S.salary) S.salary = r2(S.salary * 1.03); if (S.spouse) S.spouse = r2(S.spouse * 1.03); }
  S.happy = clamp(Math.round(S.happy + (happyTarget() - S.happy) * .25), 0, 100);
  const n = nw(); S.st.peakNW = Math.max(S.st.peakNW, n);
  if (S.st.peakNW > 1.5 && n < S.st.peakNW * .6) S.st.bigLoss = true;
  const h = liveHome(); if (h) { S.st.homeTurns++; if ((aptTr(h).tr || 0) >= .5) S.st.transitTurns++; if (S.firstHome && h.uid === S.firstHome.uid) S.st.sameHome++; }
  if (S.flags.jCrashHit && S.cash >= 0) S.st.jCrash = 1;
  if (S.deal && S.deal.t < S.t) S.deal = null;
  S.imjang = Math.min(3, S.imjang + 1);
  S.t++;
  R.cash1 = S.cash; R.nw1 = nw();
  for (const m of [...R.work.lines, ...msgs]) log(m);
  if (S.ended) return { msgs, end: true, R };
  if (S.st.interestBad >= 4 && debtTotal() > income() * 6) { S.ended = S.biz || S.flags.bizFail ? 'e17' : 'e25'; return { msgs, end: true, R }; }
  if (S.t >= MAXT) { S.ended = chooseEnding(); return { msgs, end: true, R }; }
  let e = null;
  if (S.gradT && S.t >= S.gradT) { S.gradT = 0; S.salary = r2(S.salary * 1.25); log(`🎓 대학원을 졸업했습니다! 연봉이 ${won(S.salary)}으로 올랐습니다.`); }
  const cr = CROSS[S.t] || (S.crossRetry === S.t && S.married < 0 ? CROSS[15] : null);
  if (cr) { e = { id: 'cross', run: cr }; S.crossT = S.t; }
  else if (S.plan.ch && isHomeless()) { e = EVENTS.find(x => x.id === 'cheong'); S.plan.ch = false; }
  else e = drawEvent();
  S.ev = e ? e.id : null;
  if (S.t === 10 || S.t === 20 || S.t === 30) S.interAd = true;
  save();
  return { msgs, ev: e, R };
}

function endingCands() {

    if (debt <= .001 && homes.some(p => propValue(p) >= 10)) C.push('e8');

    if (S.w.three >= 8) C.push('e12');

    if (homes.length >= 3) C.push('e38');
    if (re >= 40) C.push('e39');
    if (S.st.chWin && S.st.chGain >= 3) C.push('e3');
    if (S.st.ipjDone && !S.st.rbDone && (S.st.ipjProfit || 0) > 3) C.push('e4');

    if (S.st.bunProfit >= 2) C.push('e7');

    if (S.st.blueGain >= 1 || (S.st.blueTurns >= 16 && S.stk.blue - S.stkIn.blue >= 1)) C.push('e19');
    if (S.st.crisisBuy) C.push('e23');
    if (S.married >= 0 && S.firstHome && S.firstHome.t >= S.married) C.push('e36');
    if (S.married < 0 && S.happy < 45 && n >= 10) C.push('e37');
    if (sideJobs <= 2 && !S.w.biz && S.promos >= 2 && stockIn() < 1) C.push('e13');
    if (homes.some(p => p.peakBuy) && n < S.st.peakNW * .7) C.push('e30');
    if (ds > .45) C.push('e33');
    if (S.flags.ipjLong && S.props.some(p => p.kind === 'ipj')) C.push('e27');
    C.push('e1');
  } else {
    if (S.married >= 0 && S.kids.length && S.happy >= 70) C.push('e34');
    if (S.st.chTry >= 8 && !S.st.chWin) C.push('e28');
    if (S.flags.fraud) C.push('e26');
    if (S.flags.depositLost) C.push('e32');
    if (S.flags.forcedSale) C.push('e25');

    if (S.st.crisisStkLoss >= 1) C.push('e21');
    if (stockValue() >= 1 && S.G >= S.Gh[0] * 1.4) C.push('e24');
    if (S.flags.ipjLong && S.props.some(p => p.kind === 'ipj')) C.push('e27');

  }

}

function spark(arr, w = 120, h = 34) {
  if (!arr || arr.length < 2) return '';
  const mn = Math.min(...arr), mx = Math.max(...arr), sx = w / (arr.length - 1), sy = mx > mn ? (h - 4) / (mx - mn) : 0;
  const pts = arr.map((v, i) => `${(i * sx).toFixed(1)},${(h - 2 - (v - mn) * sy).toFixed(1)}`).join(' ');
  const up = arr[arr.length - 1] >= arr[0];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><polyline fill="none" stroke="${up ? '#e5484d' : '#3b82f6'}" stroke-width="2" points="${pts}"/></svg>`;
}

    const k = b.dataset.c;
    if (k === 'stk') { for (const kk of ['coin', 'lev', 'growth', 'blue']) { const need = r2(dep - S.cash); if (need <= 0) break; if (S.stk[kk] > 0) sellStock(kk, Math.min(S.stk[kk], need + .001)); } return done(`주식을 팔아 계약금 ${won(dep)}을 냈습니다. ${yearOf() + 3}년 입주 예정!`, S.cash >= dep); }
    if (k === 'cr') { S.credit = r2(S.credit + short + .001); S.cash = r2(S.cash + short + .001); return done(`신용대출 ${won(short)}을 받아 계약했습니다. ${yearOf() + 3}년 입주 예정!`, true); }
    if (k === 'pa') { S.flags.parentsLoan = true; S.happy = clamp(S.happy - 5, 0, 100); if (Math.random() < .5) { S.cash = r2(S.cash + short + .001); return done('부모님이 노후 자금을 보태 주셨습니다. 꼭 갚겠다고 약속하고 계약했습니다.', true); } return done('부모님도 여유가 없으셨습니다. 결국 계약을 포기했습니다.', false); }
    done('눈물을 머금고 계약을 포기했습니다.', false);
  });
}

renderTitle();
</script></body></html>
